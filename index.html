<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pair Card Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Noto+Sans+KR:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --theme-1: #e89aae;
    --theme-2: #f6c8a8;
    --theme-soft: #fbe4ea;
    --theme-deep: #b56b80;
    --bg: #f5f2ed;
    --ink: #1d1d1f;
    --ink-soft: #4a4a4d;
    --muted: #9a948c;
    --line: #e6e3dd;
    --card: #ffffff;
    --gradient: linear-gradient(135deg, var(--theme-1), var(--theme-2));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', 'Noto Sans KR', sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; padding: 80px 24px 60px; }

  .toolbar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.94); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 8px;
    display: flex; align-items: center; gap: 4px; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.02);
    flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px);
  }
  .tool-btn {
    background: transparent; border: none; color: var(--ink);
    font-family: inherit; font-size: 13px; font-weight: 500;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    transition: all 0.18s ease; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .tool-btn:hover { background: var(--theme-soft); color: var(--theme-deep); }
  .tool-btn.primary { background: var(--gradient); color: #fff; }
  .tool-btn.primary:hover { filter: brightness(0.95); color: #fff; }
  .tool-btn:disabled { opacity: 0.4; cursor: wait; }

  .color-group {
    display: flex; align-items: center; gap: 6px; padding: 4px 12px;
    border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  }
  .color-label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .color-swatch {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line);
    cursor: pointer; position: relative; overflow: hidden; transition: transform 0.15s;
  }
  .color-swatch:hover { transform: scale(1.08); }
  .color-swatch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .arrow { font-size: 11px; color: var(--muted); margin: 0 -1px; }

  .slot-controls {
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px; border-right: 1px solid var(--line);
  }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: transparent; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--ink); transition: background 0.15s;
  }
  .icon-btn:hover { background: var(--theme-soft); }
  .count-badge { font-size: 12px; color: var(--muted); font-weight: 600; min-width: 18px; text-align: center; }

  .card-wrap { max-width: 860px; margin: 0 auto; }
  .card {
    background: var(--card); position: relative; border-radius: 8px;
    padding: 64px 56px 48px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.12), 0 8px 20px -12px rgba(0,0,0,0.06);
    transition: background 0.3s ease; overflow: hidden;
  }
  .card-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--gradient);
    border-radius: 8px 8px 0 0; pointer-events: none;
  }
  .card::after {
    content: ''; position: absolute; top: 22px; right: 22px;
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--gradient); opacity: 0.12; filter: blur(20px); pointer-events: none;
  }

  .head { text-align: center; margin-bottom: 30px; position: relative; }
  .dots { display: flex; justify-content: center; align-items: center; gap: 6px; margin-bottom: 22px; }
  .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--gradient); }
  .dots span:nth-child(1), .dots span:nth-child(3) { opacity: 0.4; }
  .dots span:nth-child(2) { width: 6px; height: 6px; }
  .title {
    font-family: 'EB Garamond', serif; font-style: italic; font-weight: 500;
    font-size: clamp(40px, 5.5vw, 64px); line-height: 1.05; letter-spacing: -0.005em;
    color: var(--ink); outline: none; display: inline-block; padding: 0 4px; border-radius: 3px;
  }
  .title-line { width: 48px; height: 1.5px; background: var(--gradient); margin: 14px auto 0; border-radius: 1px; }
  .names {
    margin-top: 18px; font-family: 'Cormorant Garamond','Noto Sans KR',serif;
    font-style: italic; font-weight: 500; font-size: 17px; color: var(--ink-soft); letter-spacing: 0.02em;
  }
  .names .x {
    font-style: normal; margin: 0 8px;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text;
    color: transparent; font-weight: 600;
  }
  .quote {
    text-align: center; font-family: 'Cormorant Garamond','Noto Sans KR',serif;
    font-size: 14px; line-height: 1.6; color: var(--ink-soft);
    margin: 0 auto 36px; max-width: 75%; position: relative; padding: 0 22px;
  }
  .qmark {
    font-family: 'EB Garamond',serif; font-style: italic; font-size: 32px; line-height: 0;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text;
    color: transparent; position: absolute; top: 14px;
  }
  .qmark.left { left: 0; } .qmark.right { right: 0; }
  .qtext { font-style: italic; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 36px; }

  .slot {
    position: relative; aspect-ratio: 1/1; background: #ece8e1;
    border-radius: 4px; overflow: hidden; cursor: pointer; transition: all 0.2s ease;
  }
  .slot::before {
    content: ''; position: absolute; inset: 0; background: var(--gradient);
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 0;
  }
  .slot:not(.has-image):hover::before { opacity: 0.08; }
  .slot:not(.has-image):hover { transform: translateY(-2px); box-shadow: 0 10px 20px -8px rgba(0,0,0,0.15); }
  .slot.has-image { background: #000; }
  .slot.has-image:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -8px rgba(0,0,0,0.15); }

  .img-wrap { position: absolute; inset: 0; overflow: hidden; }

  .slot img.disp {
    position: absolute; top: 50%; left: 50%;
    width: auto; height: auto; max-width: none; max-height: none;
    display: block; transform-origin: center center;
    user-select: none; -webkit-user-drag: none; pointer-events: auto;
    transition: transform 0.04s linear;
  }
  .slot img.exp {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: none; pointer-events: none;
  }

  .slot.zoomed img.disp { cursor: grab; }
  .slot.dragging img.disp { cursor: grabbing; transition: none; }

  .slot .placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; color: #b5afa6; pointer-events: none; transition: color 0.2s; z-index: 1;
  }
  .slot:hover .placeholder { color: var(--theme-deep); }
  .slot .plus {
    font-size: 28px; font-weight: 200; line-height: 1;
    background: var(--gradient); -webkit-background-clip: text; background-clip: text;
    color: transparent; opacity: 0.5; transition: opacity 0.2s;
  }
  .slot:hover .plus { opacity: 1; }
  .slot .ph-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; }
  .slot.has-image .placeholder { display: none; }

  .zoom-bar {
    position: absolute; bottom: 8px; left: 10px; right: 10px; height: 26px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 14px; padding: 0 10px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 3;
  }
  .slot.has-image:hover .zoom-bar { opacity: 1; pointer-events: auto; }
  @media (hover: none) { .slot.has-image .zoom-bar { opacity: 1; pointer-events: auto; } }
  .zoom-bar input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none; background: transparent; height: 14px; margin: 0;
  }
  .zoom-bar input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.3); }
  .zoom-bar input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.3); }
  .zoom-bar input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: #fff; cursor: pointer; margin-top: -4.5px;
  }
  .zoom-bar input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; border: none;
  }
  .zoom-ico { color: rgba(255,255,255,0.85); font-size: 11px; cursor: pointer; user-select: none; padding: 2px; }

  .slot .remove-btn {
    position: absolute; top: 6px; right: 6px; width: 24px; height: 24px;
    border-radius: 50%; background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
    color: #fff; border: none; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; transition: background 0.15s; z-index: 4;
  }
  .slot .remove-btn:hover { background: #000; }
  .slot.has-image:hover .remove-btn { display: flex; }
  @media (hover: none) { .slot.has-image .remove-btn { display: flex; } }

  .slot input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 2; }
  .slot.has-image input[type="file"] { display: none; }
  .slot.dragover { box-shadow: inset 0 0 0 2px var(--theme-deep); }
  .slot.dragover::before { opacity: 0.18; }

  .foot { text-align: center; }
  .rule { width: 48px; height: 1.5px; background: var(--gradient); margin: 0 auto 14px; border-radius: 1px; }
  .credit { font-size: 11px; color: var(--muted); letter-spacing: 0.12em; font-family: 'Inter',sans-serif; }
  .sparkle { color: var(--theme-deep); margin-right: 6px; }

  .editable { outline: none; border-radius: 3px; padding: 1px 3px; transition: background 0.15s; }
  .editable:hover { background: rgba(0,0,0,0.03); }
  .editable:focus { background: rgba(255,235,200,0.5); box-shadow: 0 0 0 2px rgba(0,0,0,0.08); }

  .card.exporting * { transition: none !important; }
  .card.exporting .editable { background: transparent !important; box-shadow: none !important; }
  .card.exporting .slot { transform: none !important; box-shadow: none !important; }
  .card.exporting .remove-btn { display: none !important; }
  .card.exporting .zoom-bar { display: none !important; opacity: 0 !important; pointer-events: none !important; }
  .card.exporting .placeholder { display: none !important; }
  .card.exporting .qmark { display: none !important; }
  /* html2canvas: ::after blur circle 숨기기 */
  .card.exporting::after { display: none !important; }
  /* html2canvas: background-clip:text 미지원 → solid color 폴백 */
  .card.exporting .names .x,
  .card.exporting .qmark,
  .card.exporting .slot .plus {
    background: none !important;
    -webkit-background-clip: unset !important;
    background-clip: unset !important;
    color: var(--theme-deep) !important;
  }

  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; line-height: 1.7; }

  @media (max-width: 680px) {
    body { padding: 90px 14px 40px; }
    .card { padding: 48px 28px 36px; }
    .grid { grid-template-columns: repeat(2,1fr); }
    .title { font-size: 40px; }
    .quote { max-width: 92%; padding: 0 18px; }
    .toolbar { padding: 6px; gap: 2px; }
    .tool-btn { padding: 6px 10px; font-size: 12px; }
    .color-group { padding: 2px 6px; gap: 4px; }
  }
</style>
</head>
<body>

<div class="toolbar" id="toolbar">
  <div class="color-group">
    <span class="color-label">테마</span>
    <label class="color-swatch" id="theme1Swatch">
      <input type="color" id="theme1Color" value="#e89aae" />
    </label>
    <span class="arrow">→</span>
    <label class="color-swatch" id="theme2Swatch">
      <input type="color" id="theme2Color" value="#f6c8a8" />
    </label>
    <span class="color-label" style="margin-left:6px">배경</span>
    <label class="color-swatch" id="bgSwatch" style="background:#ffffff">
      <input type="color" id="bgColor" value="#ffffff" />
    </label>
  </div>
  <div class="slot-controls">
    <button class="icon-btn" id="removeSlot">−</button>
    <span class="count-badge" id="slotCount">6</span>
    <button class="icon-btn" id="addSlot">+</button>
  </div>
  <button class="tool-btn" id="resetBtn">초기화</button>
  <button class="tool-btn primary" id="downloadBtn">↓ 이미지 저장</button>
</div>

<div class="card-wrap">
  <div class="card" id="card">
    <div class="card-bar"></div>
    <header class="head">
      <div class="dots"><span></span><span></span><span></span></div>
      <h1 class="title editable" contenteditable="true" spellcheck="false">Pair Title</h1>
      <div class="title-line"></div>
      <p class="names">
        <span class="editable" contenteditable="true" spellcheck="false">Character A</span>
        <span class="x">×</span>
        <span class="editable" contenteditable="true" spellcheck="false">Character B</span>
      </p>
    </header>
    <p class="quote">
      <span class="qmark left">"</span>
      <em class="qtext editable" contenteditable="true" spellcheck="false">여기에 페어를 표현하는 짧은 한 줄을 적어보세요.</em>
      <span class="qmark right">"</span>
    </p>
    <div class="grid" id="grid"></div>
    <footer class="foot">
      <div class="rule"></div>
      <p class="credit editable" contenteditable="true" spellcheck="false"><span class="sparkle" contenteditable="false">✦</span>@YOUR_NAME</p>
    </footer>
  </div>
</div>

<p class="hint">슬롯을 클릭하거나 드래그앤드롭으로 이미지를 올려보세요. 이미지에 마우스를 올리면 줌 슬라이더가 나타나고, 확대된 이미지는 드래그해서 위치 조정할 수 있어요.</p>

<script>
const grid         = document.getElementById('grid');
const theme1Color  = document.getElementById('theme1Color');
const theme2Color  = document.getElementById('theme2Color');
const theme1Swatch = document.getElementById('theme1Swatch');
const theme2Swatch = document.getElementById('theme2Swatch');
const bgColor      = document.getElementById('bgColor');
const bgSwatch     = document.getElementById('bgSwatch');
const downloadBtn  = document.getElementById('downloadBtn');
const resetBtn     = document.getElementById('resetBtn');
const addSlotBtn   = document.getElementById('addSlot');
const removeSlotBtn= document.getElementById('removeSlot');
const slotCount    = document.getElementById('slotCount');
const card         = document.getElementById('card');

let slots = 6;
const MIN_SLOTS = 1, MAX_SLOTS = 12;

// ── slot ──────────────────────────────────────────────
function createSlot() {
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.innerHTML = `
    <div class="img-wrap"></div>
    <div class="placeholder"><div class="plus">+</div><div class="ph-label">image</div></div>
    <input type="file" accept="image/*" />
    <div class="zoom-bar">
      <span class="zoom-ico" data-act="out">−</span>
      <input type="range" min="1" max="3" step="0.05" value="1" />
      <span class="zoom-ico" data-act="in">+</span>
    </div>
    <button class="remove-btn">×</button>`;

  const fi = slot.querySelector('input[type=file]');
  const rb = slot.querySelector('.remove-btn');
  const zr = slot.querySelector('.zoom-bar input[type=range]');

  fi.addEventListener('change', e => { if (e.target.files[0]) loadImage(slot, e.target.files[0]); });
  rb.addEventListener('click',  e => { e.stopPropagation(); e.preventDefault(); clearSlot(slot); });
  zr.addEventListener('input',  e => setSlotZoom(slot, parseFloat(e.target.value)));
  zr.addEventListener('click',  e => e.stopPropagation());

  slot.querySelectorAll('.zoom-ico').forEach(ico => {
    ico.addEventListener('click', e => {
      e.stopPropagation();
      const minZ = parseFloat(slot.dataset.minZoom || 1);
      const step = minZ * 0.2;
      const next = ico.dataset.act === 'in'
        ? Math.min(minZ * 3, parseFloat(zr.value) + step)
        : Math.max(minZ,     parseFloat(zr.value) - step);
      zr.value = next; setSlotZoom(slot, next);
    });
  });

  slot.addEventListener('wheel', e => {
    if (!slot.classList.contains('has-image')) return;
    e.preventDefault();
    const minZ = parseFloat(slot.dataset.minZoom || 1);
    const next = Math.max(minZ, Math.min(minZ * 3, parseFloat(zr.value) + e.deltaY * -0.002));
    zr.value = next; setSlotZoom(slot, next);
  }, { passive: false });

  setupPan(slot);

  slot.addEventListener('dragenter', e => { e.preventDefault(); slot.classList.add('dragover'); });
  slot.addEventListener('dragover',  e => e.preventDefault());
  slot.addEventListener('dragleave', e => { if (e.target === slot) slot.classList.remove('dragover'); });
  slot.addEventListener('drop', e => {
    e.preventDefault(); slot.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadImage(slot, f);
  });
  return slot;
}

// ── transform ──────────────────────────────────────────
function applyTransform(slot) {
  const img = slot.querySelector('img.disp');
  if (!img) return;
  const z  = parseFloat(slot.dataset.zoom || 1);
  const tx = parseFloat(slot.dataset.tx   || 0);
  const ty = parseFloat(slot.dataset.ty   || 0);
  img.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${z})`;
}

function clampTranslate(slot) {
  const img = slot.querySelector('img.disp');
  if (!img) return;
  const z  = parseFloat(slot.dataset.zoom || 1);
  const sr = slot.getBoundingClientRect();
  // 이미지 가장자리 1px 안전 여백을 두어 안티앨리어싱으로 배경이 비치지 않게 클램핑 값 수정 (- 1)
  const maxX = Math.max(0, (img.naturalWidth  * z - sr.width)  / 2 - 1);
  const maxY = Math.max(0, (img.naturalHeight * z - sr.height) / 2 - 1);
  slot.dataset.tx = Math.max(-maxX, Math.min(maxX, parseFloat(slot.dataset.tx || 0)));
  slot.dataset.ty = Math.max(-maxY, Math.min(maxY, parseFloat(slot.dataset.ty || 0)));
}

function setSlotZoom(slot, zoom) {
  const minZ = parseFloat(slot.dataset.minZoom || 1);
  slot.dataset.zoom = zoom;
  if (zoom <= minZ + 0.001) {
    slot.dataset.tx = 0; slot.dataset.ty = 0; slot.classList.remove('zoomed');
  } else {
    slot.classList.add('zoomed'); clampTranslate(slot);
  }
  applyTransform(slot);
}

function setupPan(slot) {
  let sx=0, sy=0, stx=0, sty=0, active=false;
  const dn = (cx,cy,ev) => {
    if (!slot.classList.contains('has-image')) return;
    if (parseFloat(slot.dataset.zoom||1) <= parseFloat(slot.dataset.minZoom||1)+0.001) return;
    active=true; sx=cx; sy=cy;
    stx=parseFloat(slot.dataset.tx||0); sty=parseFloat(slot.dataset.ty||0);
    slot.classList.add('dragging'); ev.preventDefault();
  };
  const mv = (cx,cy,ev) => {
    if (!active) return;
    slot.dataset.tx = stx+(cx-sx); slot.dataset.ty = sty+(cy-sy);
    clampTranslate(slot); applyTransform(slot); ev.preventDefault();
  };
  const up = () => { if(!active) return; active=false; slot.classList.remove('dragging'); };

  slot.addEventListener('mousedown', e => { if (e.target.closest('.zoom-bar,.remove-btn')) return; dn(e.clientX,e.clientY,e); });
  document.addEventListener('mousemove', e => mv(e.clientX,e.clientY,e));
  document.addEventListener('mouseup', up);
  slot.addEventListener('touchstart', e => { if(e.target.closest('.zoom-bar,.remove-btn')) return; dn(e.touches[0].clientX,e.touches[0].clientY,e); },{passive:false});
  slot.addEventListener('touchmove',  e => mv(e.touches[0].clientX,e.touches[0].clientY,e),{passive:false});
  slot.addEventListener('touchend', up);
}

// ── load / clear ───────────────────────────────────────
function loadImage(slot, file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const wrap = slot.querySelector('.img-wrap');
    wrap.querySelectorAll('img').forEach(i => i.remove());

    const img = document.createElement('img');
    img.className = 'disp';
    img.src = ev.target.result;
    img.draggable = false;
    img.onload = () => {
      const sr = slot.getBoundingClientRect();
      // +2px 여유: 소수점 픽셀 렌더링 오차(안티앨리어싱)로 검은 배경이 삐져나오는 현상 방지
      const coverScale = Math.max((sr.width + 2) / img.naturalWidth, (sr.height + 2) / img.naturalHeight);
      slot.dataset.minZoom = coverScale;
      slot.dataset.zoom    = coverScale;
      slot.dataset.tx = 0; slot.dataset.ty = 0;
      const zr = slot.querySelector('.zoom-bar input[type=range]');
      if (zr) { zr.min = coverScale; zr.max = coverScale*3; zr.step = coverScale*0.05; zr.value = coverScale; }
      applyTransform(slot);
    };
    wrap.appendChild(img);
    slot.classList.add('has-image'); slot.classList.remove('zoomed');
  };
  reader.readAsDataURL(file);
}

function clearSlot(slot) {
  slot.querySelector('.img-wrap').innerHTML = '';
  slot.classList.remove('has-image','zoomed');
  const fi = slot.querySelector('input[type=file]'); if (fi) fi.value = '';
  const zr = slot.querySelector('.zoom-bar input[type=range]');
  if (zr) { zr.min=1; zr.max=3; zr.step=0.05; zr.value=1; }
  Object.assign(slot.dataset, {zoom:1, tx:0, ty:0, minZoom:1});
}

function renderSlots() {
  const existing = Array.from(grid.children), cur = existing.length;
  if (slots > cur) for (let i=cur; i<slots; i++) grid.appendChild(createSlot());
  else if (slots < cur) for (let i=cur-1; i>=slots; i--) grid.removeChild(existing[i]);
  slotCount.textContent = slots;
}

// ── 저장: gradient CSS 변수 → 실제 색상값 인라인 (html2canvas CSS var 미지원 보완) ──
function inlineGradients() {
  const restores = [];
  // background: gradient 를 사용하는 실제 DOM 요소들
  const bgEls = [
    ...card.querySelectorAll('.card-bar, .rule, .title-line, .dots span'),
  ];
  for (const el of bgEls) {
    const orig = el.style.background;
    const computed = getComputedStyle(el).backgroundImage;
    // backgroundImage 가 none 이면 backgroundColor 를 사용
    const color = computed !== 'none' ? computed : getComputedStyle(el).backgroundColor;
    el.style.background = color;
    restores.push({ el, prop: 'background', orig });
  }
  // color 를 사용하는 요소 (sparkle ✦)
  for (const el of card.querySelectorAll('.sparkle')) {
    const orig = el.style.color;
    el.style.color = getComputedStyle(el).color;
    restores.push({ el, prop: 'color', orig });
  }
  return restores;
}

function restoreGradients(restores) {
  for (const { el, prop, orig } of restores) {
    el.style[prop] = orig;
  }
}

// ── 저장: 이미지 슬롯을 canvas로 사전 크롭 (html2canvas의 CSS transform 해석 보완) ──
function bakeImages() {
  const restores = [];
  for (const slot of grid.querySelectorAll('.slot.has-image')) {
    const dispImg = slot.querySelector('img.disp');
    if (!dispImg || !dispImg.naturalWidth) continue;

    const sr = slot.getBoundingClientRect();
    const SCALE = 2;
    const cw = Math.round(sr.width  * SCALE);
    const ch = Math.round(sr.height * SCALE);
    const cnv = document.createElement('canvas');
    cnv.width = cw; cnv.height = ch;
    const ctx = cnv.getContext('2d');

    const z  = parseFloat(slot.dataset.zoom || 1);
    const tx = parseFloat(slot.dataset.tx   || 0) * SCALE;
    const ty = parseFloat(slot.dataset.ty   || 0) * SCALE;
    const dw = dispImg.naturalWidth  * z * SCALE;
    const dh = dispImg.naturalHeight * z * SCALE;
    ctx.drawImage(dispImg, cw/2 + tx - dw/2, ch/2 + ty - dh/2, dw, dh);

    // disp → 단순 fill img로 교체
    dispImg.style.display = 'none';
    const expImg = document.createElement('img');
    expImg.className = 'exp';
    expImg.src = cnv.toDataURL('image/png');
    expImg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;';

    const wrap = slot.querySelector('.img-wrap');
    wrap.appendChild(expImg);
    restores.push({ wrap, expImg, dispImg });
  }
  return restores;
}

function unbakeImages(restores) {
  for (const { wrap, expImg, dispImg } of restores) {
    wrap.removeChild(expImg);
    dispImg.style.display = '';
  }
}

// ── colors ─────────────────────────────────────────────
const ph  = h => { const c=h.replace('#',''); return {r:parseInt(c.slice(0,2),16),g:parseInt(c.slice(2,4),16),b:parseInt(c.slice(4,6),16)}; };
const rh  = (r,g,b) => '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
const shade  = (hex,a) => { const {r,g,b}=ph(hex); return a>=0?rh(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a):rh(r*(1+a),g*(1+a),b*(1+a)); };
const avgHex = (h1,h2) => { const a=ph(h1),b=ph(h2); return rh((a.r+b.r)/2,(a.g+b.g)/2,(a.b+b.b)/2); };

function updateTheme() {
  const c1=theme1Color.value, c2=theme2Color.value, avg=avgHex(c1,c2);
  const s=document.documentElement.style;
  s.setProperty('--theme-1',c1); s.setProperty('--theme-2',c2);
  s.setProperty('--theme-soft',shade(avg,0.82)); s.setProperty('--theme-deep',shade(avg,-0.25));
  theme1Swatch.style.background=`linear-gradient(135deg,${c1},${c2})`; theme2Swatch.style.background=c2;
}
theme1Color.addEventListener('input', updateTheme);
theme2Color.addEventListener('input', updateTheme);
bgColor.addEventListener('input', e => { document.documentElement.style.setProperty('--card',e.target.value); bgSwatch.style.background=e.target.value; });

addSlotBtn.addEventListener('click',     () => { if(slots<MAX_SLOTS){slots++;renderSlots();} });
removeSlotBtn.addEventListener('click',  () => { if(slots>MIN_SLOTS){slots--;renderSlots();} });
resetBtn.addEventListener('click', () => { if(confirm('모든 변경사항을 초기화할까요?')) location.reload(); });

// ── download ───────────────────────────────────────────
downloadBtn.addEventListener('click', async () => {
  downloadBtn.disabled = true;
  const origText = downloadBtn.textContent;
  downloadBtn.textContent = '저장 중...';

  // 1) 이미지 슬롯 사전 크롭 (CSS transform → 단순 fill)
  const restores = bakeImages();

  // 2) gradient CSS 변수 인라인 (html2canvas CSS var 보완)
  const gradientRestores = inlineGradients();

  // 3) exporting 클래스 → UI 요소 숨기기
  card.classList.add('exporting');

  // 3) 폰트 로드 완료 대기
  try { await document.fonts.ready; } catch(e) {}
  await new Promise(r => setTimeout(r, 100));

  try {
    // html2canvas: 브라우저 렌더링 엔진으로 직접 캡처 → 폰트 100% 정확
    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: getComputedStyle(card).backgroundColor || '#ffffff',
      logging: false,
      removeContainer: true,
      // 캡처 범위를 카드 영역으로 고정
      x: 0, y: 0,
      scrollX: 0, scrollY: 0,
    });

    canvas.toBlob(blob => {
      if (!blob) { alert('이미지 생성 실패. 다시 시도해주세요.'); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `pair-card-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');

  } catch(err) {
    console.error('저장 오류:', err);
    alert('저장 오류: ' + err.message);
  } finally {
    unbakeImages(restores);
    restoreGradients(gradientRestores);
    card.classList.remove('exporting');
    downloadBtn.disabled = false;
    downloadBtn.textContent = origText;
  }
});

renderSlots();
updateTheme();
</script>
</body>
</html>
